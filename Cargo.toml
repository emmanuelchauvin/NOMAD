[workspace]
resolver = "2"
members = [
    "crates/nomad-core",
    "crates/nomad-genome",
    "crates/nomad-sandbox",
    "crates/nomad-evaluator",
    "crates/nomad-operator",
    "crates/nomad-orchestrator",
    "crates/nomad-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NOMAD Research Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nomad-swarm/nomad"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
petgraph = { version = "0.6", features = ["serde-1"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal workspace crates
nomad-core = { path = "crates/nomad-core" }
nomad-genome = { path = "crates/nomad-genome" }
nomad-sandbox = { path = "crates/nomad-sandbox" }
nomad-evaluator = { path = "crates/nomad-evaluator" }
nomad-operator = { path = "crates/nomad-operator" }
nomad-orchestrator = { path = "crates/nomad-orchestrator" }
